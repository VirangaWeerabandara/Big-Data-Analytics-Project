# Scrape targets grow step by step (simulators in Step 2, Spark in Step 4).
# Alert rules are added in Step 8.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: vitals-simulator
    static_configs:
      - targets: ["vitals-simulator:8001"]

  - job_name: lab-simulator
    static_configs:
      - targets: ["lab-simulator:8002"]

  - job_name: spark-stream
    static_configs:
      - targets: ["spark:8003"]
